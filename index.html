<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Room Layout Planner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Event Room Layout Planner</h1>
    <div class="header-controls">
      <button id="undoBtn" title="Undo (Ctrl+Z)">&#8630; Undo</button>
      <button id="redoBtn" title="Redo (Ctrl+Y)">&#8631; Redo</button>
      <button id="saveBtn">&#128190; Save</button>
      <button id="loadBtn">&#128194; Load</button>
      <button id="clearBtn">&#128465; Clear All</button>
      <button id="exportBtn">&#128247; Export PNG</button>
      <input type="file" id="loadFile" accept=".json" style="display:none">
    </div>
  </header>

  <div class="app">
    <div class="sidebar">
      <h2>Furniture</h2>
      <div class="furniture-list">
        <div class="furniture-item" draggable="true" data-type="round-table" data-w="80" data-h="80">
          <div class="furniture-preview round-table"></div> Round Table
        </div>
        <div class="furniture-item" draggable="true" data-type="rect-table" data-w="120" data-h="60">
          <div class="furniture-preview rect-table"></div> Rect Table
        </div>
        <div class="furniture-item" draggable="true" data-type="chair" data-w="36" data-h="36">
          <div class="furniture-preview chair"></div> Chair
        </div>
        <div class="furniture-item" draggable="true" data-type="sofa" data-w="120" data-h="50">
          <div class="furniture-preview sofa"></div> Sofa
        </div>
        <div class="furniture-item" draggable="true" data-type="stage" data-w="200" data-h="80">
          <div class="furniture-preview stage"></div> Stage
        </div>
        <div class="furniture-item" draggable="true" data-type="bar" data-w="160" data-h="50">
          <div class="furniture-preview bar"></div> Bar Counter
        </div>
        <div class="furniture-item" draggable="true" data-type="plant" data-w="40" data-h="40">
          <div class="furniture-preview plant"></div> Plant
        </div>
        <div class="furniture-item" draggable="true" data-type="dj-booth" data-w="100" data-h="60">
          <div class="furniture-preview dj-booth"></div> DJ Booth
        </div>
        <div class="furniture-item" draggable="true" data-type="table-6" data-w="140" data-h="70">
          <div class="furniture-preview table-6"></div> Table 6p
        </div>
        <div class="furniture-item" draggable="true" data-type="table-8" data-w="160" data-h="80">
          <div class="furniture-preview table-8"></div> Table 8p
        </div>
        <div class="furniture-item" draggable="true" data-type="tv-screen" data-w="120" data-h="20">
          <div class="furniture-preview tv-screen"></div> TV Screen
        </div>
        <div class="furniture-item" draggable="true" data-type="entrance" data-w="60" data-h="20">
          <div class="furniture-preview entrance"></div> Entrance
        </div>
      </div>

      <h2>Room Size</h2>
      <div class="room-controls">
        <label>Width (px) <input type="number" id="roomWidth" value="900" min="400" max="1400" /></label>
        <label>Height (px) <input type="number" id="roomHeight" value="650" min="300" max="1000" /></label>
        <label class="snap-row">
          <input type="checkbox" id="snapToggle" checked /> Snap to Grid
        </label>
        <button id="applyRoom">Apply</button>
      </div>

      <h2>Selected Item</h2>
      <div id="noSelection">No item selected</div>
      <div id="selectionPanel" style="display:none">
        <div class="item-controls">
          <label>Label <input type="text" id="itemLabel" /></label>
          <label>Rotate <div class="input-row"><input type="number" id="itemRotate" value="0" step="15" /> <span class="unit">deg</span></div></label>
          <label>Width <div class="input-row"><input type="number" id="itemWidth" min="10" /> <span class="unit">px</span></div></label>
          <label>Height <div class="input-row"><input type="number" id="itemHeight" min="10" /> <span class="unit">px</span></div></label>
          <label>Color <input type="color" id="itemColor" value="#6c8ebf" /></label>
          <label>Opacity <input type="range" id="itemOpacity" min="20" max="100" value="100" /></label>
          <button id="duplicateItem">&#10065; Duplicate</button>
          <button id="deleteItem" class="btn-danger">&#128465; Delete</button>
        </div>
      </div>
    </div>

    <div class="canvas-wrapper">
      <div id="room" class="room">
        <div class="grid-overlay"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
